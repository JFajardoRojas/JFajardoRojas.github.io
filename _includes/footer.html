<footer class="site-footer">
    <div class="wrap footer-inner">
        <div>
            <div class="footer-name">{{ site.author }}</div>
            <div class="footer-meta">{{ site.position }} · {{ site.institution }} · {{ site.location }}</div>
        </div>
        <div class="footer-links">
            <a href="mailto:{{ site.email }}">Email</a>
            <a href="{{ site.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
            <a href="{{ site.orcid }}" target="_blank" rel="noopener">ORCID</a>
            <a href="{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
            <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        </div>
    </div>
    <div class="wrap footer-base">© {{ 'now' | date: "%Y" }} {{ site.author }}</div>
</footer>
