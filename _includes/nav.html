{%- assign s = page.section -%}
<header class="site-header">
    <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
            <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,4 56,18 56,46 32,60 8,46 8,18"/><circle cx="32" cy="32" r="9"/></svg>
            <span class="brand-text">
                <span class="brand-name">J. Fernando Fajardo-Rojas</span>
                <span class="brand-sub">{{ site.tagline }}</span>
            </span>
        </a>

        <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
            <span></span><span></span><span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Main">
            <a href="{{ '/research/'     | relative_url }}" {% if s == 'research' %}aria-current="page"{% endif %}>Research</a>
            <a href="{{ '/publications/' | relative_url }}" {% if s == 'publications' %}aria-current="page"{% endif %}>Publications</a>
            <a href="{{ '/news/'         | relative_url }}" {% if s == 'news' %}aria-current="page"{% endif %}>News</a>
            <a href="{{ '/cv/'           | relative_url }}" {% if s == 'cv' %}aria-current="page"{% endif %}>CV</a>
            <a href="{{ '/contact/'      | relative_url }}" {% if s == 'contact' %}aria-current="page"{% endif %}>Contact</a>
            {%- comment -%} Hidden: blog & photos (site kept scientific-only)
            <a href="{{ '/blog/'   | relative_url }}" {% if s == 'blog' %}aria-current="page"{% endif %}>Blog</a>
            <a href="{{ '/photos/' | relative_url }}" {% if s == 'photos' %}aria-current="page"{% endif %}>Photos</a>
            {%- endcomment -%}
        </nav>
    </div>
</header>
