# ============================================================
#  Site configuration
#  (Change values here once; they apply across the whole site)
# ============================================================
title: "J. Fernando Fajardo-Rojas"
tagline: "Computational Materials Scientist"
description: "J. Fernando Fajardo-Rojas — computational materials scientist using molecular simulation and data-efficient machine learning to accelerate the discovery of porous materials for gas adsorption and catalysis."
author: "J. Fernando Fajardo-Rojas"
email: "jfajardorojas@mines.edu"

# ---- Current position (edit these when you move) -----------
position: "Postdoctoral Fellow"
department: "Department of Physics · Materials@Mines"
institution: "Colorado School of Mines"
group: "Toberer Group"
location: "Golden, Colorado"
office: "CoorsTek Building, Colorado School of Mines, Golden, CO 80401"

# ---- Profiles ----------------------------------------------
scholar: "https://scholar.google.com/citations?user=FpanAPQAAAAJ&hl=en"
orcid: "https://orcid.org/0000-0002-3109-0219"
github: "https://github.com/jfajardorojas"
linkedin: "https://www.linkedin.com/in/jair-fernando-fajardo-rojas-7a791078/"

url: "https://jfajardorojas.github.io"
baseurl: ""

# ---- Blog settings ----------------------------------------
# Posts live in the _posts/ folder. Excerpts use the first paragraph.
excerpt_separator: "<!--more-->"
permalink: /blog/:year/:month/:title/

# ---- Build settings ---------------------------------------
markdown: kramdown
highlighter: rouge
timezone: America/Denver

# Files/folders Jekyll should NOT copy into the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - node_modules
  # Hidden sections (remove these lines to bring them back)
  - blog.html
  - photos.html
  - assets/images/photos
  - assets/images/blog
  # Old hero video (replaced by the interactive discovery loop)
  - assets/video

# Default front-matter so you can omit "layout:" in blog posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      published: false   # blog hidden; delete this line to republish posts
